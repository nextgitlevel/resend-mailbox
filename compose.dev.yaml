name: resend-mailbox-dev

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RESEND_MAILBOX_TEST_PASSWORD: ${RESEND_MAILBOX_TEST_PASSWORD:?Set RESEND_MAILBOX_TEST_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-test-role.sh:/docker-entrypoint-initdb.d/10-init-test-role.sh:ro

  redis:
    image: redis:8.6-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:3.91
    command: server -filer -s3 -s3.port=8333 -dir=/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:19000:8333"
    volumes:
      - seaweedfs_data:/data

volumes:
  seaweedfs_data:
  postgres_data:
  redis_data:
